<!DOCTYPE html>
<html>
<head>
    <title>Plus Address Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Generate +Address</h2>

        <label for="baseEmail">Base Email:</label>
        <input type="email" id="baseEmail" placeholder="your.email@example.com" required>

        <label for="tag">Tag:</label>
        <input type="text" id="tag" placeholder="e.g., test1, signupA" required>

        <button id="generateButton">Generate & Copy</button>

        <p id="result"></p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
